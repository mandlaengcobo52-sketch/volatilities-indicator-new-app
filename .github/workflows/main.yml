name: Build and Sign APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and Sign Volatilities Indicator
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

            - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools" >> "$GITHUB_PATH"
          test -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"

      - name: Install Android build tools
        run: |
          sdkmanager --install "platform-tools" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check project
        run: |
          set -euo pipefail
          java -version
          gradle --version
          test -d app || {
            echo "ERROR: app directory not found"
            exit 1
          }

      - name: Build Debug APK
        run: gradle --no-daemon assembleDebug

      - name: Build Release APK
        run: gradle --no-daemon assembleRelease

      - name: Prepare signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      - name: Sign Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"

          KEYSTORE="$RUNNER_TEMP/release.jks"
          RELEASE_DIR="app/build/outputs/apk/release"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          test -s "$KEYSTORE"

          APK="$(find "$RELEASE_DIR" -maxdepth 1 \
            -type f -name '*.apk' \
            ! -name '*signed*' \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: No release APK was produced."
            find "$RELEASE_DIR" -maxdepth 2 -type f || true
            exit 1
          fi

          "$BUILD_TOOLS/zipalign" -f -v 4 \
            "$APK" "$RUNNER_TEMP/aligned-release.apk"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEYSTORE_PASSWORD \
            --out "$RELEASE_DIR/volatilities-indicator-release.apk" \
            "$RUNNER_TEMP/aligned-release.apk"

          "$BUILD_TOOLS/apksigner" verify --verbose \
            "$RELEASE_DIR/volatilities-indicator-release.apk"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: volatilities-indicator-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: volatilities-indicator-signed-release-apk
          path: app/build/outputs/apk/release/volatilities-indicator-release.apk
          if-no-files-found: error
