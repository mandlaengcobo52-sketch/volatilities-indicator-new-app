
name: Build Volatilities Indicator APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Release APK
        run: gradle --no-daemon assembleRelease

      - name: Decode Android Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/volatilities-release.jks"

      - name: Align and Sign Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          UNSIGNED_APK=$(find . -path "*/build/outputs/apk/release/*-unsigned.apk" -print -quit)

          if [ -z "$UNSIGNED_APK" ]; then
            echo "Unsigned release APK not found"
            exit 1
          fi

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          "$BUILD_TOOLS/zipalign" -f -p 4 \
            "$UNSIGNED_APK" \
            "$RUNNER_TEMP/volatilities-aligned.apk"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/volatilities-release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$RUNNER_TEMP/volatilities-indicator-release.apk" \
            "$RUNNER_TEMP/volatilities-aligned.apk"

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            "$RUNNER_TEMP/volatilities-indicator-release.apk"

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: volatilities-indicator-signed-release
          path: ${{ runner.temp }}/volatilities-indicator-release.apk
          
